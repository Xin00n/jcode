name: Build

'on':
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    name: Build Linux (${{ matrix.target || matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: jcode-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: jcode-linux-aarch64
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
            artifact: jcode-linux-aarch64-musl
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
            artifact: jcode-linux-x86_64-musl
          - os: macos-13
            arch: x86_64
            artifact: jcode-macos-x86_64
          - os: macos-14
            arch: aarch64
            artifact: jcode-macos-aarch64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact: jcode-windows-x86_64.exe
          - os: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
            artifact: jcode-windows-aarch64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: ${{ !matrix.target && runner.os == 'Linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libssl-dev

      # musl target: no glibc, so cmake/openssl are unnecessary. The musl-gcc
      # wrapper installed below is the cross linker.
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Install musl cross toolchain
        if: ${{ matrix.target && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || matrix.arch }}
          cache-all-crates: "true"

      - name: Build release binary
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            export CC_aarch64_unknown_linux_musl=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            fi
            # jemalloc cannot build against musl (needs glibc C11 atomics), so
            # the musl binary uses the system allocator instead.
            # linux-compat-vendored-openssl builds OpenSSL from source for the
            # musl target, which has no system libssl.
            cargo build --release -j 4 --features linux-compat-vendored-openssl \
              --target ${{ matrix.target }}
          elif [ "${{ runner.os }}" = Windows ]; then
            # MSVC has no jemalloc build support here; use the system allocator.
            cargo build --release -j 4 --target ${{ matrix.target }}
          else
            cargo build --release --features jemalloc -j 4
          fi

      - name: Verify executable
        if: ${{ !matrix.target }}
        shell: bash
        run: |
          ./target/release/jcode --version

      # Cross-compiled binaries cannot run on the build host; verify the artifact
      # is a real binary for the requested architecture instead.
      - name: Verify cross-compiled artifact
        if: ${{ matrix.target }}
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/jcode
          if [ "${{ runner.os }}" = Windows ]; then bin="$bin.exe"; fi
          file "$bin"
          file "$bin" | grep -qi '${{ matrix.arch }}'

      - name: Upload jcode binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/jcode*
            target/release/jcode*
          if-no-files-found: error
