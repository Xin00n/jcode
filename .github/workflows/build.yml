name: Build

'on':
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""

jobs:
  build:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: jcode-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: jcode-linux-aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          cache-all-crates: "true"

      - name: Build release binary
        run: cargo build --release --features jemalloc

      - name: Verify executable
        run: |
          ./target/release/jcode --version

      - name: Upload jcode binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/jcode
          if-no-files-found: error
