name: Build

'on':
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: "4"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            artifact: jcode-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            artifact: jcode-linux-aarch64
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
            artifact: jcode-linux-aarch64-musl
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
            artifact: jcode-linux-x86_64-musl
          - os: macos-latest
            arch: x86_64
            target: x86_64-apple-darwin
            artifact: jcode-macos-x86_64
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            artifact: jcode-macos-aarch64
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            artifact: jcode-windows-x86_64.exe
          - os: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
            artifact: jcode-windows-aarch64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: ${{ !matrix.target && runner.os == 'Linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake pkg-config libssl-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl cross toolchain
        if: ${{ matrix.target && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools musl-dev

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target || matrix.arch }}
          cache-all-crates: "true"

      - name: Build release binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            export CC_aarch64_unknown_linux_musl=musl-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            if [ "${{ matrix.arch }}" = x86_64 ]; then
              export CC_x86_64_unknown_linux_musl=musl-gcc
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            fi
            # jemalloc cannot build against musl (needs glibc C11 atomics), so
            # the musl binary uses the system allocator instead.
            # linux-compat-vendored-openssl builds OpenSSL from source for the
            # musl target, which has no system libssl.
            cargo build --release -j 4 --features linux-compat-vendored-openssl \
              --target ${{ matrix.target }}
          elif [ "${{ runner.os }}" = Windows ]; then
            # MSVC has no jemalloc build support here; use the system allocator.
            cargo build --release -j 4 --target ${{ matrix.target }}
          elif [ -n "${{ matrix.target }}" ]; then
            cargo build --release --features jemalloc -j 4 --target ${{ matrix.target }}
          else
            cargo build --release --features jemalloc -j 4
          fi

      - name: Verify executable
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            bin="target/${{ matrix.target }}/release/jcode"
          else
            bin="target/release/jcode"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            bin="$bin.exe"
            file "$bin"
            file "$bin" | grep -qi '${{ matrix.arch }}'
          elif [ "${{ runner.os }}" = macOS ]; then
            file "$bin"
            file "$bin" | grep -qi '${{ matrix.arch }}'
            if [ "${{ matrix.arch }}" = aarch64 ]; then
              "$bin" --version
            fi
          elif [[ "${{ matrix.target }}" == *musl* ]]; then
            file "$bin"
            file "$bin" | grep -qi '${{ matrix.arch }}'
          else
            "$bin" --version
          fi

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            bin="target/${{ matrix.target }}/release/jcode"
          else
            bin="target/release/jcode"
          fi
          if [ "${{ runner.os }}" = Windows ]; then
            cp "$bin.exe" "dist/${{ matrix.artifact }}"
          else
            if [ "${{ runner.os }}" = macOS ]; then
              codesign --force --sign - --identifier com.jcode.cli "$bin" || true
            fi
            cp "$bin" "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - name: Upload jcode binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloaded release assets:"
          ls -la release-assets/

          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.3"
          fi

          echo "Target release tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, uploading assets..."
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" release-assets/* \
              --title "jcode $TAG_NAME" \
              --notes "Multi-platform automated binary release for Linux (x86_64, aarch64, musl), macOS (Apple Silicon, Intel), and Windows (x86_64, aarch64)."
          fi
